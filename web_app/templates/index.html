<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCTV Live + Capturas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body { background: #0b0d10; }
      .video-wrap {
        background: #111418; border-radius: 12px; overflow: hidden;
        box-shadow: 0 0 0 1px #161a20, 0 8px 24px rgba(0,0,0,.35);
      }
      .thumb {
        width: 100%; height: 160px; object-fit: cover; border-radius: 10px;
        box-shadow: 0 0 0 1px #161a20, 0 4px 16px rgba(0,0,0,.25);
      }
      .muted { color:#a8b3c1; }
      .header {
        position: sticky; top: 0; z-index: 10; backdrop-filter: blur(6px);
        border-bottom: 1px solid #161a20;
      }
    </style>
  </head>
  <body>
    <nav class="header navbar navbar-dark bg-transparent">
      <div class="container py-2">
        <span class="navbar-brand mb-0 h1">📹 CCTV Live</span>
        <span class="muted small">RTSP → OpenCV → Flask</span>
      </div>
    </nav>

    <main class="container py-4">
      <div class="row g-4">
        <div class="col-12 col-lg-8">
          <div class="video-wrap">
            <!-- MJPEG stream -->
            <img id="live" src="/video_feed" alt="Live" class="w-100" />
          </div>
          <div class="d-flex justify-content-between align-items-center mt-2">
            <span class="muted small">Transmisión en vivo (MJPEG)</span>
          </div>
        </div>

        <div class="col-12 col-lg-4">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <h5 class="mb-0">Últimas capturas</h5>
            <span class="muted small" id="lastRefresh">—</span>
          </div>

          <div id="thumbs" class="vstack gap-3">
            <!-- Las 3 imágenes se inyectan por JS -->
            <div class="muted small">Cargando imágenes…</div>
          </div>
        </div>
      </div>
    </main>

    <script src="/static/main.js"></script>
  </body>
</html>
