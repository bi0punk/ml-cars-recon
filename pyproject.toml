[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-cars-recon"
version = "1.0.0"
description = "Detección de vehículos y captura de patentes desde RTSP con YOLO"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24",
    "requests>=2.33.0",
    "ultralytics>=8.0.0",
    "Flask>=3.1.3",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/bi0punk/ml-cars-recon"
Issues = "https://github.com/bi0punk/ml-cars-recon/issues"

[project.scripts]
capture-isapi = "capture_isapi:main"
capture-preroll = "capture_preroll:main"
capture-preroll-lanes = "capture_preroll_lanes:main"

[tool.setuptools]
py-modules = ["capture_isapi", "capture_preroll", "capture_preroll_lanes"]

[tool.setuptools.packages.find]
include = ["common*", "web_app*"]

[tool.setuptools.package-data]
web_app = ["templates/*.html", "static/*.js", "static/css/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=common --cov=web_app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = [
    "common",
    "web_app",
    "capture_isapi.py",
    "capture_preroll.py",
    "capture_preroll_lanes.py",
]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "cv2",
    "ultralytics",
    "ultralytics.*",
    "flask",
    "flask.*",
    "requests",
    "requests.*",
    "dotenv",
]
follow_imports = "skip"